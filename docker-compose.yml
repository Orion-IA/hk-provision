services:
  hk-provision:
    build:
      context: .
      dockerfile: Dockerfile
    image: hk-provision:latest
    container_name: hk-provision
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
